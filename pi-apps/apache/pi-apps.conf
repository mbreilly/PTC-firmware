# PartsDB Pi: everything on port 80. Installed by ~/apps/apache/enable.sh (undo: rollback.sh).
#   /              landing page (/var/www/pi-apps)
#   /parts-db/     Part-DB (Symfony, /var/www/partdb/public, PHP via mod_php)
#   /labels/       QL label designer        -> 127.0.0.1:8097
#   /ptc-qc/       PTC QC station (+ websockets /ws, /setup) -> 127.0.0.1:8080
#   /aoi/          AOI Parts Mapper         -> 127.0.0.1:8090
#   /scan-station/ Part-DB label scan station -> 127.0.0.1:8095
#   /sd-dup/       SD card duplicator (key required) -> 127.0.0.1:8765
# Old Part-DB links (/en/..., /scan/... on printed QR labels, /api/...) are redirected to /parts-db/... with 308.
<VirtualHost *:80>
    ServerName 128.91.45.130
    ServerAlias partdb.lan www.partdb.lan PartsDB.local localhost 127.0.0.1
    DocumentRoot /var/www/pi-apps
    <Directory /var/www/pi-apps>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    # Part-DB in a sub-directory; its .htaccess works out the base path itself
    Alias /parts-db /var/www/partdb/public
    <Directory /var/www/partdb/public>
        AllowOverride All
        Require all granted
    </Directory>

    # apps; first match wins, so the exact prefixes come before the catch-all
    RedirectMatch 301 ^/(parts-db|labels|ptc-qc|aoi|scan-station|sd-dup)$ /$1/
    RedirectMatch 308 ^/(?!(?:parts-db|labels|ptc-qc|aoi|scan-station|sd-dup)(?:/|$)|index\.html$)(.+)$ /parts-db/$1

    ProxyPreserveHost On
    ProxyTimeout 300
    ProxyPass        /labels/       http://127.0.0.1:8097/
    ProxyPassReverse /labels/       http://127.0.0.1:8097/
    ProxyPass        /ptc-qc/       http://127.0.0.1:8080/ upgrade=websocket
    ProxyPassReverse /ptc-qc/       http://127.0.0.1:8080/
    ProxyPass        /aoi/          http://127.0.0.1:8090/
    ProxyPassReverse /aoi/          http://127.0.0.1:8090/
    ProxyPass        /scan-station/ http://127.0.0.1:8095/
    ProxyPassReverse /scan-station/ http://127.0.0.1:8095/
    ProxyPass        /sd-dup/       http://127.0.0.1:8765/
    ProxyPassReverse /sd-dup/       http://127.0.0.1:8765/

    ErrorLog /var/log/apache2/partdb_error.log
    CustomLog /var/log/apache2/partdb_access.log combined
</VirtualHost>
